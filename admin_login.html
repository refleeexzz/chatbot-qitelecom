<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar • QIBOT Admin</title>
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
  --azul-bebe: #6fd3f7;
  --azul-bebe-escuro: #3bb0dd;
  --azul-escuro: #1a237e;
  --amarelo: #f6d55c;
  --card-bg: rgba(255, 255, 255, 0.92);
  --card-border: rgba(255, 255, 255, 0.45);
  --input-border: var(--azul-bebe-escuro);
  --input-focus: var(--azul-bebe);
  --text-primary: #1a237e;
  --text-muted: #5f5f6b;
  --error-bg: #ffe6e9;
  --error-border: #ff7b96;
  --success-bg: #e3f7ef;
  --success-border: #4cc08a;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
  min-height: 100vh;
  font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(120deg, var(--azul-bebe) 0%, var(--azul-bebe-escuro) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  color: var(--text-primary);
  transition: background 0.4s;
}

body.dark-mode {
    background: linear-gradient(120deg, var(--azul-escuro) 0%, var(--azul-bebe-escuro) 100%) !important;
    color: #e3f0ff !important;
}

.darkmode-btn {
  background: transparent;
  border: none;
  font-size: 2.2rem;
  cursor: pointer;
  color: #1a237e;
  transition: color 0.2s, background 0.2s;
  padding: 10px 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  outline: none;
}

.darkmode-btn:focus {
  box-shadow: 0 0 0 2px var(--azul-bebe);
}

body.dark-mode .darkmode-btn {
    color: var(--azul-bebe);
    background: #222b45;
}

.login-wrapper {
    width: min(420px, 100%);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 28px 80px rgba(20, 16, 41, 0.28);
            padding: 36px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 28px;
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--text-muted);
            font-size: 15px;
        }

        .status-box {
            display: none;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid transparent;
        }

        .status-box.show {
            display: block;
        }

        .status-box.error {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: #792032;
        }

        .status-box.success {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: #1f6c4d;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            padding: 14px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(138, 63, 252, 0.2);
        }

        .form-field {
            margin-bottom: 20px;
        }

        button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-weight: 600;
  font-size: 16px;
  background: var(--amarelo);
  color: #1a237e;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(246,213,92,0.12);
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s;
}

        button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 16px 30px rgba(246,213,92,0.18);
  background: #ffe580;
}

button:disabled {
  opacity: 0.65;
  cursor: wait;
}

        .foot-note {
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --card-bg: rgba(10, 6, 30, 0.72);
                --card-border: rgba(138, 63, 252, 0.25);
                --input-border: rgba(138, 63, 252, 0.25);
                --text-primary: #f5f5ff;
                --text-muted: #c7c7d1;
                --error-bg: rgba(255, 102, 139, 0.15);
                --error-border: rgba(255, 102, 139, 0.4);
                --success-bg: rgba(76, 192, 138, 0.18);
                --success-border: rgba(76, 192, 138, 0.45);
            }

            input[type="text"],
            input[type="password"] {
                background: rgba(17, 12, 42, 0.85);
                color: var(--text-primary);
            }
        }
    </style>
</head>
<body>
    <main class="login-wrapper">
        <header class="brand" style="display:flex;flex-direction:column;gap:6px;position:relative;">
  <div style="position:absolute;top:0;right:0;">
    <button id="darkModeBtn" class="darkmode-btn" aria-label="Alternar modo escuro">
      <i id="darkModeIcon" class="bi bi-moon-stars-fill"></i>
    </button>
  </div>
    <h1>QIBOT Admin</h1>
  <span>Autentique-se para acessar o painel de administrador.</span>
</header>

        <div id="statusBox" class="status-box"></div>

        <form id="loginForm" autocomplete="on" novalidate>
            <div class="form-field">
                <label for="username">Usuário</label>
                <input id="username" name="username" type="text" placeholder="Seu usuário" autocomplete="username" required>
            </div>

            <div class="form-field">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" placeholder="Sua senha" autocomplete="current-password" required>
            </div>

            <button type="submit" id="submitBtn">Entrar no painel</button>
        </form>

        <p class="foot-note">Dica: mantenha suas credenciais em um gerenciador seguro.</p>
    </main>

    <script>
        const darkModeBtn = document.getElementById('darkModeBtn');
    const darkModeIcon = document.getElementById('darkModeIcon');
        function updateDarkModeIcon() {
            if (document.body.classList.contains('dark-mode')) {
                darkModeIcon.className = 'bi bi-brightness-high-fill'; // ícone de luz
                darkModeBtn.setAttribute('aria-label', 'Alternar para modo claro');
            } else {
    darkModeIcon.className = 'bi bi-moon-stars-fill'; // ícone de lua
    darkModeBtn.setAttribute('aria-label', 'Alternar para modo escuro');
  }
}
darkModeBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  updateDarkModeIcon();
});
updateDarkModeIcon();

        const form = document.getElementById('loginForm');
        const statusBox = document.getElementById('statusBox');
        const submitBtn = document.getElementById('submitBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        displayMessageFromQuery();

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showStatus('Preencha usuário e senha.', 'error');
                return;
            }

            setLoading(true);
            hideStatus();

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success) {
                    const message = data.message || 'Credenciais inválidas. Tente novamente.';
                    showStatus(message, 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                    return;
                }

                showStatus('Login realizado! Redirecionando...', 'success');
                setTimeout(() => {
                    window.location.replace(data.redirect || '/admin');
                }, 300);
            } catch (error) {
                showStatus(`Erro de conexão: ${error.message}`, 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.textContent = loading ? 'Autenticando…' : 'Entrar no painel';
        }

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = `status-box ${type} show`;
        }

        function hideStatus() {
            statusBox.className = 'status-box';
            statusBox.textContent = '';
        }

        function displayMessageFromQuery() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('error') === '1') {
                        showStatus('Usuário ou senha incorretos.', 'error');
                    } else if (params.get('session') === 'expired') {
                        showStatus('Sua sessão expirou. Faça login novamente.', 'error');
                    }
        }
    </script>
</body>
</html>
