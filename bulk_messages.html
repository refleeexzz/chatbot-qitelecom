<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparos em Lote - QIBOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover {
            background: #f5f5f5;
        }

        .radio-option input[type="radio"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .radio-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .phone-input-container {
            display: none;
            margin-top: 15px;
        }

        .phone-input-container.active {
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alert.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-details {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Disparos em Lote</h1>
        <p class="subtitle">Envie mensagens via WhatsApp para seus clientes</p>

        <div id="alert" class="alert"></div>

        <form id="bulkForm">
            <div class="form-group">
                <label for="message">Mensagem *</label>
                <textarea 
                    id="message" 
                    name="message" 
                    rows="6" 
                    placeholder="Digite a mensagem que será enviada para os clientes..."
                    required
                    maxlength="1000"
                ></textarea>
                <div class="char-counter">
                    <span id="charCount">0</span>/1000 caracteres
                </div>
            </div>

            <div class="form-group">
                <label>Destinatários *</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="recipient_type" value="all" checked>
                        <span>Enviar para todos os contatos</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recipient_type" value="leads">
                        <span>Apenas Leads</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recipient_type" value="clients">
                        <span>Apenas Clientes</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recipient_type" value="custom">
                        <span>Números específicos</span>
                    </label>
                </div>

                <div id="phoneInputContainer" class="phone-input-container">
                    <input 
                        type="text" 
                        id="phones" 
                        name="phones" 
                        placeholder="Ex: 5511999999999, 5511888888888"
                    >
                    <p class="help-text">Separe múltiplos números com vírgula. Use formato internacional (5511999999999)</p>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                🚀 Enviar Mensagens
            </button>
        </form>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Enviando mensagens... Aguarde.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('bulkForm');
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const alert = document.getElementById('alert');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');
        const phoneInputContainer = document.getElementById('phoneInputContainer');
        const radioOptions = document.querySelectorAll('.radio-option');

        // Contador de caracteres
        messageInput.addEventListener('input', () => {
            charCount.textContent = messageInput.value.length;
        });

        // Gerenciar seleção de destinatários
        document.querySelectorAll('input[name="recipient_type"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Atualizar visual dos radio buttons
                radioOptions.forEach(opt => opt.classList.remove('selected'));
                e.target.closest('.radio-option').classList.add('selected');

                // Mostrar/ocultar input de telefones customizados
                if (e.target.value === 'custom') {
                    phoneInputContainer.classList.add('active');
                } else {
                    phoneInputContainer.classList.remove('active');
                }
            });
        });

        // Marcar primeiro radio como selecionado
        radioOptions[0].classList.add('selected');

        // Submeter formulário
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = messageInput.value.trim();
            if (!message) {
                showAlert('Por favor, digite uma mensagem.', 'error');
                return;
            }

            const recipientType = document.querySelector('input[name="recipient_type"]:checked').value;
            let payload = { message };

            if (recipientType === 'all') {
                payload.send_to_all = true;
            } else if (recipientType === 'leads') {
                payload.send_to_all = true;
                payload.filter_by_type = 'Lead';
            } else if (recipientType === 'clients') {
                payload.send_to_all = true;
                payload.filter_by_type = 'Cliente';
            } else if (recipientType === 'custom') {
                const phonesInput = document.getElementById('phones').value;
                if (!phonesInput.trim()) {
                    showAlert('Digite pelo menos um número de telefone.', 'error');
                    return;
                }
                payload.phones = phonesInput.split(',').map(p => p.trim()).filter(p => p);
            }

            // Mostrar loading
            form.style.display = 'none';
            loading.classList.add('active');
            hideAlert();

            try {
                const response = await fetch('/api/bulk-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                loading.classList.remove('active');
                form.style.display = 'block';

                if (response.ok && result.status === 'success') {
                    let msg = `✅ ${result.message}`;
                    if (result.errors && result.errors.length > 0) {
                        msg += `\n\n⚠️ Alguns erros:\n${result.errors.slice(0, 3).join('\n')}`;
                    }
                    showAlert(msg, 'success');
                    form.reset();
                    charCount.textContent = '0';
                    radioOptions.forEach(opt => opt.classList.remove('selected'));
                    radioOptions[0].classList.add('selected');
                    phoneInputContainer.classList.remove('active');
                } else {
                    showAlert(`❌ Erro: ${result.message || 'Falha ao enviar mensagens'}`, 'error');
                }
            } catch (error) {
                loading.classList.remove('active');
                form.style.display = 'block';
                showAlert(`❌ Erro de conexão: ${error.message}`, 'error');
            }
        });

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert ${type} show`;
            alert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function hideAlert() {
            alert.classList.remove('show');
        }
    </script>
</body>
</html>
