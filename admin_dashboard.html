<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - QIBOT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"> QIBOT - Painel Admin</span>
            <div class="d-flex align-items-center text-white">
                <span class="me-3" id="username"></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button"> Dashboard</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="contacts-tab" data-bs-toggle="tab" data-bs-target="#contacts" type="button"> Contatos</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="bulk-tab" data-bs-toggle="tab" data-bs-target="#bulk" type="button"> Mensagens em Massa</button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabContent">
            <!-- Dashboard -->
            <div class="tab-pane fade show active" id="dashboard" role="tabpanel">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card text-white bg-primary">
                            <div class="card-body">
                                <h5 class="card-title">Total de Contatos</h5>
                                <h2 id="totalContacts">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-success">
                            <div class="card-body">
                                <h5 class="card-title">Com Opt-in</h5>
                                <h2 id="optInContacts">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-info">
                            <div class="card-body">
                                <h5 class="card-title">Mensagens Hoje</h5>
                                <h2 id="messagesSent">0</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contatos -->
            <div class="tab-pane fade" id="contacts" role="tabpanel">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Gerenciar Contatos</h5>
                        <div id="contactsAlert"></div>
                        <button class="btn btn-primary mb-3" onclick="loadContacts()"> Atualizar</button>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Telefone</th>
                                        <th>Email</th>
                                        <th>Opt-in</th>
                                        <th>Data</th>
                                    </tr>
                                </thead>
                                <tbody id="contactsBody">
                                    <tr><td colspan="5" class="text-center">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mensagens em Massa -->
            <div class="tab-pane fade" id="bulk" role="tabpanel">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Enviar Mensagens em Massa</h5>
                        <div id="bulkAlert"></div>
                        <form id="bulkMessageForm">
                            <div class="mb-3">
                                <label class="form-label">Mensagem *</label>
                                <textarea class="form-control" id="messageText" rows="4" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Destinatários *</label>
                                <select class="form-select" id="recipientType" required>
                                    <option value="all">Todos os contatos</option>
                                    <option value="optin">Apenas com Opt-in</option>
                                    <option value="custom">Lista personalizada</option>
                                </select>
                            </div>
                            <div class="mb-3" id="customListGroup" style="display:none;">
                                <label class="form-label">Números (separados por vírgula)</label>
                                <textarea class="form-control" id="customPhones" rows="3"></textarea>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="confirmSend">
                                <label class="form-check-label" for="confirmSend">
                                    Confirmo que desejo enviar esta mensagem
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary" id="btnSendBulk"> Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem("admin_token");
        const username = localStorage.getItem("admin_username");
        if (!token) window.location.href = "/admin_login.html";
        document.getElementById("username").textContent = username || "Admin";

        function logout() {
            localStorage.clear();
            window.location.href = "/admin_login.html";
        }

        async function loadDashboard() {
            try {
                const res = await fetch("/api/admin/contacts", { headers: { Authorization: `Bearer ${token}` }});
                if (res.ok) {
                    const contacts = await res.json();
                    document.getElementById("totalContacts").textContent = contacts.length;
                    document.getElementById("optInContacts").textContent = contacts.filter(c => c.opt_in).length;
                }
            } catch(e) { console.error(e); }
        }

        async function loadContacts() {
            const tbody = document.getElementById("contactsBody");
            tbody.innerHTML = "<tr><td colspan=\"5\" class=\"text-center\">Carregando...</td></tr>";
            try {
                const res = await fetch("/api/admin/contacts", { headers: { Authorization: `Bearer ${token}` }});
                if (res.ok) {
                    const contacts = await res.json();
                    tbody.innerHTML = contacts.map(c => `
                        <tr>
                            <td>${c.name || "-"}</td>
                            <td>${c.phone}</td>
                            <td>${c.email || "-"}</td>
                            <td><span class="badge ${c.opt_in ? "bg-success" : "bg-danger"}">${c.opt_in ? "Sim" : "Não"}</span></td>
                            <td>${new Date(c.created_at).toLocaleDateString("pt-BR")}</td>
                        </tr>
                    `).join("");
                }
            } catch(e) { console.error(e); }
        }

        document.getElementById("recipientType").addEventListener("change", e => {
            document.getElementById("customListGroup").style.display = e.target.value === "custom" ? "block" : "none";
        });

        document.getElementById("bulkMessageForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!document.getElementById("confirmSend").checked) {
                alert("Confirme o envio!");
                return;
            }
            const btn = document.getElementById("btnSendBulk");
            btn.disabled = true;
            try {
                const res = await fetch("/api/admin/bulk-message", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                    body: JSON.stringify({
                        message: document.getElementById("messageText").value,
                        recipient_type: document.getElementById("recipientType").value,
                        phones: document.getElementById("customPhones").value.split(",").map(p => p.trim())
                    })
                });
                const data = await res.json();
                alert(res.ok ? `Sucesso! ${data.sent} mensagens enviadas` : `Erro: ${data.message}`);
            } catch(e) { alert("Erro: " + e.message); }
            finally { btn.disabled = false; }
        });

        loadDashboard();
    </script>
</body>
</html>
