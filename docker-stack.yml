version: "3.8"

services:

  qibot:
    image: qibot:latest
    build: .
    depends_on:
      - redis
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_ADDR: redis:6379
      SQLITE_DB_PATH: "/app/data/leads.db"
      PORT: "${PORT}"
      BODY_LIMIT_BYTES: "${BODY_LIMIT_BYTES}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
    volumes:
      - qibot_db:/app/data
      - credentials:/app/credentials.json:ro
      # In Swarm don't mount local html files from the host; bake them into the image or serve from object storage.
    networks:
      - qibot-network
    secrets:
      - whatsapp_token
      - whatsapp_app_secret
      - meta_app_secret
      - admin_password
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == manager]
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - qibot-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  redis_data:
  qibot_db:
  credentials:

networks:
  qibot-network:
    driver: overlay

secrets:
  whatsapp_token:
    external: true
  whatsapp_app_secret:
    external: true
  meta_app_secret:
    external: true
  admin_password:
    external: true
