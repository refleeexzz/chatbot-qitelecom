<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QI TELECOM - Chat de Atendimento</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .darkmode-btn {
        background: transparent;
  border: none;
  font-size: 2.2rem;
  cursor: pointer;
  color: #1a237e;
  transition: color 0.2s, background 0.2s;
  padding: 10px 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  outline: none;
}
.darkmode-btn:focus {
  box-shadow: 0 0 0 2px #6fd3f7;
}
  
    :root{
      --brand-900: #0a3a66;
      --brand-700: #1a237e;
      --brand-500: #3949ab;
      --accent-500: #f6d55c;
      --accent-400: #fed330;
      --muted-100: #f7fafc;
      --muted-300: #e2e8f0;
      --text: #1a202c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(120deg, #6fd3f7 0%, #3bb0dd 100%);
      background-size: 200% 200%;
      animation: gradientBG 16s ease-in-out infinite;
      position: relative;
      overflow: hidden;
      transition: background 0.4s;
    }
    body.dark-mode {
      background: linear-gradient(120deg, #1a237e 0%, #3bb0dd 100%);
    }
    .dark-mode .container {
      background: #16213a;
      color: #e3f0ff;
    }
    .dark-mode .header {
      background: linear-gradient(135deg, #1a237e 0%, #3bb0dd 100%);
      color: #e3f0ff;
    }
    .dark-mode .subtitle-bg {
      color: #e3f0ff;
    }
    .dark-mode .msg.user {
      background: #3bb0dd;
      color: #e3f0ff;
    }
    .dark-mode .msg.bot {
      background: #222b45;
      color: #e3f0ff;
      border-color: #3bb0dd;
    }
    .dark-mode .input-container {
      background: #16213a;
      border-top: 1px solid #3bb0dd;
    }
    .dark-mode input[type=text] {
      background: #222b45;
      color: #e3f0ff;
      border-color: #3bb0dd;
    }
    .dark-mode input[type=text]:focus {
      border-color: #6fd3f7;
      background: #16213a;
      box-shadow: 0 0 0 3px rgba(111, 211, 247, 0.2);
    }
    .dark-mode .btn-primary {
      background: linear-gradient(135deg, #3bb0dd, #6fd3f7);
      color: #16213a;
    }
    .dark-mode .footer {
      background: #16213a;
      border-top: 1px solid #3bb0dd;
      color: #e3f0ff;
    }
    .dark-mode .footer .social-links a {
      color: #6fd3f7;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: url('data:image/svg+xml;utf8,<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/></filter><rect width="400" height="400" filter="url(%23noise)" opacity="0.08"/></svg>');
      opacity: 0.7;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .container { 
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      overflow: hidden;
      backdrop-filter: blur(10px);
      margin: 0 auto;
    }
    
    .header {
      background: linear-gradient(135deg, #6fd3f7 0%, #3bb0dd 100%);
      color: #1a237e;
      padding: 18px 20px;
      position: relative;
      z-index: 10;
    }

    .header-inner{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:space-between;
    }

    .brand{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .logo{ width:56px; height:56px; object-fit:contain; border-radius:8px; background:rgba(255,255,255,0.06); padding:6px }

    .brand-title{ font-size:18px; font-weight:700; letter-spacing:0.4px; margin-bottom:2px }

    .slogan{ font-size:12px; opacity:0.95; margin-top:4px }
    
    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="white" opacity="0.1"/><circle cx="80" cy="40" r="1" fill="white" opacity="0.1"/><circle cx="40" cy="80" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
    }
    
    .header h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 5px;
      position: relative;
      z-index: 1;
    }
    
    .header .subtitle {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }
    
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      opacity: 0.95;
      position: relative;
      z-index: 1;
      margin-bottom:6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }
    
    #chat { 
      min-height: 320px;
      max-height: 48vh;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: max-height 0.2s;
    }
    .dark-mode #chat {
      background: #1a237e;
      color: #e3f0ff;
    }

  main[role="log"]{ background: var(--muted-100); }
  .dark-mode main[role="log"]{ background: #1a237e; color: #e3f0ff; }
    
    #chat::-webkit-scrollbar {
      width: 6px;
    }
    
    #chat::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }
    
    #chat::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }
    
    #chat::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
    
    .msg { 
      max-width: 85%;
      word-wrap: break-word;
      animation: fadeInUp 0.3s ease-out;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .msg.user { 
      align-self: flex-end;
      background: #6fd3f7;
      color: #1a237e;
      padding: 12px 18px;
      border-radius: 18px 18px 5px 18px;
      font-weight: 500;
      box-shadow: 0 2px 12px rgba(111, 211, 247, 0.18);
    }
    
    .msg.bot { 
      align-self: flex-start;
      background: white;
      color: #2d3748;
      padding: 15px 20px;
      border-radius: 18px 18px 18px 5px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      line-height: 1.6;
      position: relative;
    }
    
    .msg.bot::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 20px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 6px solid white;
    }
    
    .msg.bot strong {
      color: #1a202c;
      font-weight: 600;
    }
    
    .input-container {
      padding: 20px;
      background: white;
      border-top: 1px solid #e2e8f0;
    }

    .btn-primary{
      background: linear-gradient(135deg,var(--accent-500),var(--accent-400));
      color:var(--text);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight:600;
      cursor:pointer;
      box-shadow: 0 6px 18px rgba(15,23,42,0.12);
    }

    .header-cta{ display:flex; gap:12px; align-items:center }

    .footer{ background: #fff; border-top:1px solid var(--muted-300); padding:14px }
    .footer-inner{ display:flex; gap:20px; justify-content:space-between; align-items:center }
    .footer .social-links a{ margin-right:8px; color:var(--brand-900); }
    
    form { 
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    
    .input-wrapper {
      flex: 1;
      position: relative;
    }
    
    input[type=text] { 
      width: 100%;
      padding: 14px 20px;
      border-radius: 25px;
      border: 2px solid #e2e8f0;
      font-size: 14px;
      transition: all 0.3s ease;
      background: #f7fafc;
      outline: none;
    }
    
    input[type=text]:focus { 
      border-color: #f6d55c;
      background: white;
      box-shadow: 0 0 0 3px rgba(246, 213, 92, 0.2);
    }
    
    input[type=text]::placeholder {
      color: #a0aec0;
    }
    
    button { 
      background: linear-gradient(135deg, #f6d55c 0%, #fed330 100%);
      color: #2d3748;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(246, 213, 92, 0.4);
    }
    
    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(246, 213, 92, 0.5);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: white;
      padding: 15px 20px;
      border-radius: 18px 18px 18px 5px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .typing-dots {
      display: flex;
      gap: 4px;
    }
    
    .typing-dot {
      width: 8px;
      height: 8px;
      background: #cbd5e0;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      30% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }
    
    @media (max-width: 600px) {
      body {
        padding: 6px;
      }
      .container {
        max-width: 100vw;
        border-radius: 12px;
        margin: 0;
      }
      .header {
        padding: 14px;
      }
      .header h2 {
        font-size: 18px;
      }
      #chat {
        min-height: 180px;
        max-height: 38vh;
        padding: 10px;
      }
      .input-container {
        padding: 8px;
      }
      .header-inner{ flex-direction:column; align-items:flex-start }
      .header-cta{ width:100%; display:flex; justify-content:space-between }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header" role="banner">
      <div class="header-inner">
        <div class="brand">
          <!-- Replace /icon.png with your real logo path -->
          <img src="/icon.png" alt="QI Telecom logo" class="logo" onerror="this.style.display='none'" />
          <div>
            <h1 class="brand-title">QI TELECOM</h1>
            <div class="subtitle subtitle-bg">Atendimento Inteligente</div>
            <div class="slogan">Sua operadora de internet 100% fibra — suporte rápido e confiável</div>
          </div>
        </div>

        <div class="header-cta">
          <div class="status-indicator" aria-live="polite">
            <div class="status-dot" aria-hidden="true"></div>
            Online agora
          </div>
          <button id="darkModeBtn" class="darkmode-btn" aria-label="Alternar modo escuro">
            <i id="darkModeIcon" class="bi bi-moon-stars-fill"></i>
          </button>
        </div>
      </div>
    </header>
    
    <main id="chat" role="log" aria-live="polite">
      <!-- Chat iniciará vazio, aguardando primeira mensagem do cliente -->

      <div class="typing-indicator" id="typingIndicator" style="display:none">
      <div class="typing-dots">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
      </div>
    </main>
    
    <div class="input-container">
      <form id="chatForm">
        <div class="input-wrapper">
          <input type="text" id="msgInput" placeholder="Digite sua mensagem..." autocomplete="off" required />
        </div>
        <button type="submit" id="sendBtn">
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </div>
    
    <footer class="footer">
      <div class="footer-inner">
        <div class="contact">
          <strong>Contato</strong>
          <div>Telefone: (44) 99936-5400</div>
          <div>Email: meuplano@redeqi.com.br</div>
        </div>
        <div class="socials">
          <strong>Siga-nos</strong>
          <div class="social-links">
            <a href="#" aria-label="Facebook" title="Facebook"><i class="fab fa-facebook" href="https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.facebook.com/qi.telecom/%3Flocale%3Dpt_BR&ved=2ahUKEwipk6W_t7qQAxUEHbkGHVzvDU0QFnoECDsQAQ&usg=AOvVaw29Pn4I8z6QCjZfk31_EOiY"></i></a>
            <a href="https://www.instagram.com/qi.telecom/" aria-label="Instagram" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="LinkedIn" title="LinkedIn"><i class="fab fa-linkedin" href="https://br.linkedin.com/company/qi-telecom"></i></a>
          </div>
        </div>
      </div>
    </footer>
  </div>
  <script>
    // Modo escuro moderno
    const darkModeBtn = document.getElementById('darkModeBtn');
    const darkModeIcon = document.getElementById('darkModeIcon');
    function updateDarkModeIcon() {
      if(document.body.classList.contains('dark-mode')) {
        darkModeIcon.className = 'bi bi-brightness-high-fill'; // ícone de luz
        darkModeBtn.setAttribute('aria-label', 'Alternar para modo claro');
      } else {
        darkModeIcon.className = 'bi bi-moon-stars-fill'; // ícone de lua
        darkModeBtn.setAttribute('aria-label', 'Alternar para modo escuro');
      }
    }
    darkModeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      updateDarkModeIcon();
    });
    updateDarkModeIcon();
    const chat = document.getElementById('chat');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // Função para gerar ou obter um session_id persistente via cookie
    function uuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }
    
    function getSession() {
      let m = document.cookie.match(/(^|;)\s*session_id=([^;]+)/);
      if (m) return m[2];
      let id = uuid();
      document.cookie = 'session_id=' + id + '; path=/; max-age=31536000';
      return id;
    }
    
    const sid = getSession();

    function showTyping() {
      typingIndicator.style.display = 'block';
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      typingIndicator.style.display = 'none';
    }

    function processText(text) {
      let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      const preserve = /\[[0-9]\]|\|/.test(text);
      if (preserve) {
        html = html
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/&lt;strong&gt;/g, '<strong>')
          .replace(/&lt;\/strong&gt;/g, '</strong>');
        html = html.split('\n').join('<br>');
        return '<pre style="font-family:inherit;font-size:14px;white-space:pre-wrap;margin:0;padding:0;background:transparent;border:none;">' + html + '</pre>';
      }
      return html.replace(/\n/g, '<br>');
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const userMsg = input.value.trim();
      if (!userMsg) return;
      addMsg('user', userMsg);
      input.value = '';
      sendBtn.disabled = true;
      showTyping();
      let responded = false;
      // Fallback: sempre esconder indicador após 5s
      const fallback = setTimeout(() => {
        if (!responded) {
          hideTyping();
          sendBtn.disabled = false;
        }
      }, 5000);
      try {
        const res = await fetch('/chatbot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: sid, message: userMsg })
        });
        const data = await res.json();
        responded = true;
        clearTimeout(fallback);
        setTimeout(() => {
          hideTyping();
          addMsg('bot', data.response || 'Desculpe, não consegui responder agora.');
          sendBtn.disabled = false;
          input.focus();
        }, 800);
      } catch (error) {
        responded = true;
        clearTimeout(fallback);
        hideTyping();
        addMsg('bot', 'Erro ao conectar com o servidor.');
        sendBtn.disabled = false;
        input.focus();
      }
    };

    function addMsg(who, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      
      if (who === 'bot') {
        div.innerHTML = processText(text);
      } else {
        div.textContent = text;
      }
      
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    input.focus();
    
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) form.onsubmit(e);
      }
    });

    // CTA: sempre foca input, rola chat e insere mensagem de boas-vindas se não existir
    // ...botão iniciar chat removido...
  </script>
</body>
</html>
